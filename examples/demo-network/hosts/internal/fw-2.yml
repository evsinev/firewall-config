description:   Perimeter firewall, backup
justification: VRRP peer of fw-1; takes over every virtual address if fw-1 fails
color:         "0xEF9A9A"

gw: 198.51.100.1

interfaces:

- name: eth0
  ip:   skip

# Every virtual address of fw-1 is repeated here with a lower vrrpPriority. A vip without a
# pair on another host is a configuration error.
- name:         eth0.202
  ip:           10.20.20.12
  vip:          10.20.20.1
  vrrpPriority: 90
  vlan:         202

- name:         eth0.201
  ip:           10.20.2.12
  vip:          10.20.2.1
  vrrpPriority: 90
  vlan:         201

- name:         eth0.203
  ip:           10.20.22.12
  vip:          10.20.22.1
  vrrpPriority: 90
  vlan:         203

- name:         eth0.206
  ip:           10.20.6.12
  vip:          10.20.6.1
  vrrpPriority: 90
  vlan:         206

- name:         eth0.100
  ip:           198.51.100.12
  vrrpPriority: 90
  vlan:         100
  vips:
  - ip:    198.51.100.10
    names: gw.demo.example.com

services_links: ssh, node-exporter

blockedIpAddresses:
- ip:     203.0.113.66
  reason: Repeated credential stuffing against the web application
  type:   DROP

- ip:     203.0.113.90
  reason: Scanner, reported by the upstream provider
  type:   REJECT
