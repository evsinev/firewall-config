version: 2
updates:
  # The fat jar is committed into every description repository, so a stale dependency
  # here spreads to all of them. Java 8 is still the compile target: reject any bump
  # whose class files are newer than major version 52 - `./mvnw clean verify` fails
  # with "bad class file" rather than silently producing a jar that will not run.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # JUnit 5 is not an option here (see CLAUDE.md); 4.13.2 is the last 4.x.
      - dependency-name: junit:junit
        update-types: [version-update:semver-major]
      # jfreesvg 4.x needs Java 11 and moves SVGGraphics2D to org.jfree.svg.
      - dependency-name: org.jfree:jfreesvg
        update-types: [version-update:semver-major]
      # slf4j-nop is here only to silence Velocity, so it has to match the slf4j-api
      # that velocity-engine-core brings in (1.7.36). slf4j 2.x finds its provider
      # through ServiceLoader, which the 1.7 api never calls - a 2.x nop would sit on
      # the classpath and silence nothing, with a green build. Bump it with Velocity.
      - dependency-name: org.slf4j:slf4j-nop
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The workflows pin actions by commit sha; dependabot updates the sha and the
  # trailing "# v4" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
