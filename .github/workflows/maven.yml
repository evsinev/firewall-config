name: Build
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      # verify, not package: jacoco:check (80% line coverage) is bound to verify.
      - name: Build and test
        run: ./mvnw -B clean verify

      # The demo network is the closest thing to an end-to-end test: every generator must accept it.
      - name: Generate the demo network
        working-directory: examples/demo-network
        run: |
          JAR=../../target/firewall-config.jar
          mkdir -p gen target wiki-out bind-out
          java -jar $JAR . group-internal gen
          java -cp $JAR com.payneteasy.firewall.MainL3Diagram --run-nwdiag=false --filter internal,ipmi . current
          java -Djava.awt.headless=true -cp $JAR com.payneteasy.firewall.MainL2SvgDiagram --filter internal,ipmi . current
          java -cp $JAR com.payneteasy.firewall.MainWiki ./wiki-out dummy-key .
          java -cp $JAR com.payneteasy.firewall.MainBind . demo.example.com bind-out
          java -cp $JAR com.payneteasy.firewall.MainKeepalived . fw-1
          java -cp $JAR com.payneteasy.firewall.MainMikrotik . sw-core-1

      # The fat jar is the only delivery form, and releases are cut from tags - this makes the
      # same jar downloadable from any run, including a pull request's. Last step on purpose:
      # an artifact exists only when the tests and the demo sweep both passed.
      - name: Upload the jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firewall-config-jar
          path: target/firewall-config.jar
          if-no-files-found: error
